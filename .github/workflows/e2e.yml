name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kassa
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kassa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: ./gradlew bootJar --no-daemon -x test
        working-directory: backend

      # 로컬 프로파일로 띄운다. 가짜 게이트웨이 스위치가 있어야 실패 경로를 만든다
      - name: Start backend
        run: |
          nohup java -jar build/libs/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "백엔드가 뜨지 않았습니다"
          cat backend.log
          exit 1
        working-directory: backend

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run e2e
        run: npm run e2e
        working-directory: frontend

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7
