app = "kassa-api"
# DB(Neon)가 싱가포르라 같은 곳에 둔다.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PAYMENT_GATEWAY = "toss"

[http_service]
  internal_port = 8080
  force_https = true
  # 요청이 없으면 멈추고 다음 요청에 켠다. 멈춘 동안은 스케줄러도 쉬고, 켜지면 밀린 일을 이어서 한다
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health/readiness"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
