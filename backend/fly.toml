app = "kassa-api"
# DB(Neon)가 싱가포르라 같은 곳에 둔다.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PAYMENT_GATEWAY = "toss"

[http_service]
  internal_port = 8080
  force_https = true
  # 요청이 없으면 메모리째 일시 정지하고 다음 요청에 재개
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health/readiness"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
