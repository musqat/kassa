spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: localhost
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    org.hibernate.SQL: debug

app:
  order:
    expiry:
      enabled: false
      after: 30m
      interval: 60s
  saga:
    recovery:
      enabled: false
      stuck-after: 10m
      interval: 5m
  payment:
    inbox:
      enabled: false
      interval: 5s
      max-attempts: 5
    result-check:
      enabled: false
      stale-after: 3m
      interval: 1m
  crypto:
    phone-key: a2Fzc2EtdGVzdC1waG9uZS1rZXktbm90LXJlYWwhISE=
  jwt:
    # 로컬·테스트 전용. 배포는 환경 변수 JWT_SECRET
    secret: kassa-test-secret-not-a-real-key-here
  mail:
    from: no-reply@kassa.test
  frontend-url: http://localhost:3000